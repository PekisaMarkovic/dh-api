<!--
  Email: a new order came from the site, goes to every employee of the company.
  Placeholders: {title}, {intro}, {details_section}, {items_section}, {button}, {link}, {fallback}, {current_year}
  The words come from texts/order.texts.ts, the two sections are whole table rows that the code builds
  (the texts typed by the buyer are escaped there).
  Only inline styles on purpose: the placeholder replacement would eat the braces of a <style> block.
-->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f6f8fa; margin: 0; padding: 0">
  <tr>
    <td align="center" style="padding: 24px 12px">
      <table
        width="560"
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="width: 100%; max-width: 560px; background-color: #ffffff; border: 1px solid #e2e4e9; border-radius: 8px"
      >
        <!-- Logo -->
        <tr>
          <td style="padding: 32px 32px 8px; text-align: center">
            <span style="font-family: Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 800; letter-spacing: 2px; color: #334155">DH</span>
          </td>
        </tr>

        <!-- Text -->
        <tr>
          <td
            style="padding: 16px 32px 8px; text-align: center; font-family: Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #334155"
          >
            <p style="margin: 0 0 8px; font-size: 20px; font-weight: 600">{title}</p>
            <p style="margin: 0">{intro}</p>
          </td>
        </tr>

        <!-- The day, the buyer and the address, then the drinks -->
        {details_section} {items_section}

        <!-- Button -->
        <tr>
          <td style="padding: 24px 32px; text-align: center">
            <a
              href="{link}"
              style="display: inline-block; padding: 14px 32px; background-color: #0cad80; color: #ffffff; text-decoration: none; font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; border-radius: 6px"
              >{button}</a
            >
          </td>
        </tr>

        <!-- Link as text, for mail apps that do not show the button -->
        <tr>
          <td
            style="padding: 0 32px 24px; text-align: center; font-family: Helvetica, Arial, sans-serif; font-size: 12px; line-height: 1.5; color: #64748b"
          >
            {fallback}<br />
            <a href="{link}" style="color: #0cad80; word-break: break-all">{link}</a>
          </td>
        </tr>
      </table>

      <p style="margin: 16px 0 0; font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #94a3b8">&copy; {current_year} DH</p>
    </td>
  </tr>
</table>
