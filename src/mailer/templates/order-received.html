<!--
  Email: the buyer gets it right after sending an order from the site: the order is received, this is what was ordered.
  Placeholders: {brand}, {title}, {intro}, {details_section}, {items_section}, {outro}, {current_year}
  {brand} is the name of the site (the shop), not DH: the buyer does not know DH.
  The words come from texts/order.texts.ts, the two sections are whole table rows that the code builds.
  Only inline styles on purpose: the placeholder replacement would eat the braces of a <style> block.
-->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f5f5f4; margin: 0; padding: 0">
  <tr>
    <td align="center" style="padding: 24px 12px">
      <table
        width="560"
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="width: 100%; max-width: 560px; background-color: #ffffff; border: 1px solid #e7e5e4; border-radius: 8px"
      >
        <!-- The name of the shop on a dark band, the colors of the site -->
        <tr>
          <td style="padding: 24px 32px; text-align: center; background-color: #1c1917; border-radius: 8px 8px 0 0">
            <span style="font-family: Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 1px; color: #f59e0b">{brand}</span>
          </td>
        </tr>

        <!-- Text -->
        <tr>
          <td
            style="padding: 24px 32px 8px; text-align: center; font-family: Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #292524"
          >
            <p style="margin: 0 0 8px; font-size: 20px; font-weight: 600">{title}</p>
            <p style="margin: 0">{intro}</p>
          </td>
        </tr>

        <!-- The day, the address and the phone, then the drinks -->
        {details_section} {items_section}

        <!-- What happens next -->
        <tr>
          <td
            style="padding: 24px 32px; text-align: center; font-family: Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.6; color: #57534e"
          >
            {outro}
          </td>
        </tr>
      </table>

      <p style="margin: 16px 0 0; font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #a8a29e">&copy; {current_year} {brand}</p>
    </td>
  </tr>
</table>
